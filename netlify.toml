[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ============================================
# REDIRECT RULES
# ============================================

# Halaman login (URL cantik)
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
  force = true

# Halaman aktivasi card (user)
[[redirects]]
  from = "/activate"
  to = "/activate.html"
  status = 200
  force = true

# NFC route
[[redirects]]
  from = "/n/*"
  to = "/.netlify/functions/redirect?type=nfc&id=:splat"
  status = 200
  force = true

# QR route
[[redirects]]
  from = "/q/*"
  to = "/.netlify/functions/redirect?type=qr&id=:splat"
  status = 200
  force = true

# Search Places API
[[redirects]]
  from = "/api/search-places"
  to = "/.netlify/functions/search-places"
  status = 200
  force = true

# SPA fallback — HARUS paling bawah
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
