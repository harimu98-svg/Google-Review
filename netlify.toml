[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ============================================
# REDIRECT RULES
# ============================================

# NFC route
[[redirects]]
  from = "/n/*"
  to = "/.netlify/functions/redirect?type=nfc&id=:splat"
  status = 200
  force = true

# QR route
[[redirects]]
  from = "/q/*"
  to = "/.netlify/functions/redirect?type=qr&id=:splat"
  status = 200
  force = true

# Halaman aktivasi (HTML)
[[redirects]]
  from = "/activate"
  to = "/activate.html"
  status = 200
  force = true

# Submit aktivasi (POST)
[[redirects]]
  from = "/api/activate"
  to = "/.netlify/functions/activate"
  status = 200
  force = true

# Search Places API
[[redirects]]
  from = "/api/search-places"
  to = "/.netlify/functions/search-places"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
