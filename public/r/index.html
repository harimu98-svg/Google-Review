<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      padding: 60px 20px;
      background: #F8F9FA;
      color: #202124;
    }
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid #DADCE0;
      border-top-color: #1A73E8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    p { color: #5F6368; font-size: 14px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Mengarahkan ke halaman review...</p>

  <script>
    // Ambil card_id dari URL
    const params = new URLSearchParams(location.search);
    const cardId = params.get('card_id') || params.get('id');

    if (!cardId) {
      document.body.innerHTML = '<p>Card ID tidak valid</p>';
    } else {
      // Fetch data dari backend untuk dapat google_url
      fetch('/.netlify/functions/activate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'get-card-url',
          cardId: cardId
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success && data.google_url) {
          // Redirect ke google_url
          location.replace(data.google_url);
        } else {
          document.body.innerHTML = '<p>Card belum diaktivasi</p>';
        }
      })
      .catch(err => {
        console.error('Error:', err);
        document.body.innerHTML = '<p>Gagal memuat. Coba lagi.</p>';
      });
    }
  </script>
</body>
</html>
