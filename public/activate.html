<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivasi Card — DIGI CARD</title>
  <link rel="icon" type="image/jpeg" href="/Assets/logo.jpg">
  <link rel="stylesheet" href="/style.css">
  <style>
    .pin-input {
      letter-spacing: 6px;
      font-size: 22px;
      text-align: center;
      font-weight: 700;
      font-family: monospace;
      text-transform: uppercase;
    }
    .pin-hint {
      color: #888;
      font-size: 12px;
      display: block;
      margin-top: 6px;
      line-height: 1.6;
    }
    .pin-error {
      color: #EA4335;
      font-size: 13px;
      margin-top: 8px;
      text-align: center;
      min-height: 18px;
    }
  </style>
</head>
<body class="login-page">

<div class="login-box">
  <div class="login-header">
    <img src="/Assets/logo.jpg" alt="DIGI CARD" class="login-logo" onerror="this.style.display='none'">
    <h1>Aktivasi Card</h1>
   <p style="font-size:14px;color:#5F6368;margin-top:8px">
    Card ID: <strong id="cardIdDisplay" style="font-family:monospace;font-size:16px;color:#1A73E8">-</strong>
  </p>
  </div>

  <!-- STEP 1: PIN -->
  <div id="stepPin">
    <div class="form-group">
      <label>Masukkan PIN Card *</label>
      <input type="text" id="pinInput" maxlength="4" pattern="\d{4}"
       placeholder="XXXX" required class="pin-input" autocomplete="off"
       inputmode="numeric">
      <small class="pin-hint">
        PIN = <strong>4 digit angka</strong> <br>
        Lihat di bagian belakang atau bawah Digi Card.
        jika ada kendala silahkan kembali ke beranda dan chat Admin
      </small>
      <div id="pinError" class="pin-error"></div>
    </div>
    <button class="btn btn-primary btn-block" id="pinBtn">Lanjut</button>
  </div>

  <!-- STEP 2: Aktivasi (muncul setelah PIN benar) -->
  <div id="stepActivate" style="display:none">
    <div class="tabs">
      <button class="tab active" data-mode="places">🔍 Cari Usaha</button>
      <button class="tab" data-mode="manual">🔗 Paste Link</button>
    </div>

    <div id="modePlaces">
      <input type="search" id="searchInput" class="input-search"
             placeholder="Cari nama usaha..." autocomplete="off">
      <div id="statusMsg" style="display:none;padding:12px;text-align:center;color:#888;font-size:14px"></div>
      <div id="results" style="margin-top:12px"></div>
    </div>

    <div id="modeManual" style="display:none">
      <input type="url" id="manualUrl" class="input-search"
             placeholder="https://g.page/r/xxx/review">
      <p style="font-size:13px;color:#666;margin-top:8px;line-height:1.5">
        Dapatkan link dari <strong>Google Business Profile</strong> → menu "Minta ulasan".
      </p>
    </div>

    <button class="btn btn-primary btn-block" id="activateBtn" disabled style="margin-top:16px">
      Aktivasi Card
    </button>
    <div id="activateResult"></div>
  </div>

  <div style="text-align:center;margin-top:20px">
    <a href="/" style="color:#5F6368;font-size:14px">← Kembali ke Beranda</a>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const cardId = params.get('id');

if (!cardId) {
  document.body.innerHTML = '<p style="padding:40px;text-align:center">Card ID tidak valid.</p>';
  throw new Error('No cardId');
}

// Tampilkan Card ID di UI
document.getElementById('cardIdDisplay').textContent = cardId;

// ===== STEP 1: PIN =====
const pinInput = document.getElementById('pinInput');
const pinError = document.getElementById('pinError');

pinInput.focus();

pinInput.addEventListener('input', (e) => {
  e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  pinError.textContent = '';
});

function validasiPin() {
  const pin = pinInput.value.trim();
  
  if (pin.length !== 4 || !/^\d{4}$/.test(pin)) {
    pinError.textContent = 'PIN harus 4 digit angka (contoh: 7284)';
    return false;
  }

  // Validasi PIN dilakukan di server
  return true;
}

document.getElementById('pinBtn').addEventListener('click', () => {
  if (!validasiPin()) return;
  document.getElementById('stepPin').style.display = 'none';
  document.getElementById('stepActivate').style.display = 'block';
});

pinInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') document.getElementById('pinBtn').click();
});

// ===== STEP 2: Aktivasi =====
let mode = 'places';
let selectedPlace = null;
let debounceTimer = null;

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    document.getElementById('modePlaces').style.display = mode === 'places' ? 'block' : 'none';
    document.getElementById('modeManual').style.display = mode === 'manual' ? 'block' : 'none';
    updateActivateBtn();
  });
});

const searchInput = document.getElementById('searchInput');
const resultsBox = document.getElementById('results');
const statusMsg = document.getElementById('statusMsg');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  clearTimeout(debounceTimer);
  if (q.length < 3) {
    resultsBox.innerHTML = '';
    statusMsg.style.display = 'none';
    return;
  }
  statusMsg.style.display = 'block';
  statusMsg.innerHTML = 'Mencari...';
  debounceTimer = setTimeout(() => doSearch(q), 500);
});

async function doSearch(q) {
  try {
    const res = await fetch('/api/search-places?q=' + encodeURIComponent(q));
    const data = await res.json();
    if (!data.results?.length) {
      statusMsg.innerHTML = 'Tidak ada hasil. Coba kata kunci lain.';
      return;
    }
    statusMsg.style.display = 'none';
    renderResults(data.results);
  } catch (e) {
    statusMsg.innerHTML = 'Gagal mencari. Coba lagi.';
  }
}

function renderResults(results) {
  resultsBox.innerHTML = results.map(p => `
    <div class="result-item" data-place='${JSON.stringify(p).replace(/'/g, "&apos;")}'
         style="padding:12px;border:1px solid #eee;border-radius:8px;margin-bottom:8px;cursor:pointer;background:white">
      <div style="font-weight:600">${escapeHtml(p.name)}</div>
      <div style="font-size:13px;color:#666">${escapeHtml(p.address || '')}</div>
      ${p.rating ? `<div style="font-size:12px;color:#888">⭐ ${p.rating} · ${p.totalReviews || 0} review</div>` : ''}
    </div>
  `).join('');

  document.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => {
      document.querySelectorAll('.result-item').forEach(x => x.style.background = 'white');
      el.style.background = '#E8F0FE';
      selectedPlace = JSON.parse(el.dataset.place.replace(/&apos;/g, "'"));
      updateActivateBtn();
    });
  });
}

const manualUrl = document.getElementById('manualUrl');
manualUrl.addEventListener('input', updateActivateBtn);

function updateActivateBtn() {
  const btn = document.getElementById('activateBtn');
  if (mode === 'places') {
    btn.disabled = !selectedPlace;
  } else {
    const url = manualUrl.value.trim();
    const valid = /^https:\/\/(g\.page\/r\/[\w-]+\/review|search\.google\.com\/local\/writereview\?placeid=[\w-]+)/.test(url);
    btn.disabled = !valid;
  }
}

document.getElementById('activateBtn').addEventListener('click', async () => {
  const btn = document.getElementById('activateBtn');
  btn.disabled = true;
  btn.textContent = 'Memproses...';

  const body = {
    action: 'activate-card',
    cardId: cardId,
    pin: pinInput.value.trim()
  };

  if (mode === 'places') {
    body.mode = 'places';
    body.placeId = selectedPlace.placeId;
    body.placeName = selectedPlace.name;
    body.placeAddress = selectedPlace.address;
    body.reviewUrl = selectedPlace.reviewUrl;
  } else {
    body.mode = 'manual';
    body.manualUrl = manualUrl.value.trim();
  }

  try {
    const res = await fetch('/.netlify/functions/activate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();

    if (data.success) {
      document.querySelector('.login-box').innerHTML = `
        <div style="text-align:center;padding:40px 20px">
          <div style="font-size:64px;margin-bottom:16px">✅</div>
          <h1 style="color:#34A853;margin-bottom:12px">Aktivasi Berhasil!</h1>
          <p style="color:#666;margin-bottom:24px;line-height:1.6">
            Card Anda sudah aktif.<br>
            Customer tinggal tap/scan card untuk memberi review.
          </p>
          <a href="/" class="btn btn-primary">Kembali ke Beranda</a>
        </div>
      `;
    } else {
      document.getElementById('activateResult').innerHTML = 
        `<div class="error" style="margin-top:12px">❌ ${escapeHtml(data.error)}</div>`;
      btn.disabled = false;
      btn.textContent = 'Aktivasi Card';
    }
  } catch (e) {
    document.getElementById('activateResult').innerHTML = 
      `<div class="error" style="margin-top:12px">❌ Terjadi kesalahan: ${escapeHtml(e.message)}</div>`;
    btn.disabled = false;
    btn.textContent = 'Aktivasi Card';
  }
});

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}
</script>

</body>
</html>
