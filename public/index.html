<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Review Card</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #f7f7f8;
      color: #1a1a1a;
      text-align: center;
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { color: #666; line-height: 1.6; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-top: 24px;
      text-align: left;
    }
    .card h2 { font-size: 18px; margin-top: 0; }
    code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    .footer {
      margin-top: 40px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <h1>🎯 Google Review Card</h1>
  <p>Sistem NFC & QR card untuk memudahkan customer memberi review di Google Maps.</p>

  <div class="card">
    <h2>Cara Pakai</h2>
    <p>
      1. Tap/scan card Anda<br>
      2. Ikuti panduan aktivasi<br>
      3. Card siap dipakai customer
    </p>
  </div>

  <div class="card">
    <h2>Untuk Admin</h2>
    <p>
      Test card: <code>/c/001</code><br>
      Halaman aktivasi: <code>/activate?id=001</code>
    </p>
  </div>

  <p class="footer">
    © 2026 Google Review Card
  </p>
</body>
</html>
